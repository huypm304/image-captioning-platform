name: Deploy
agent: laptop
steps:
  - "aws eks update-kubeconfig --region ${AWS_REGION} --name ${CLUSTER_NAME}"
  - |
    set -euo pipefail
    REGION="${AWS_REGION:-${AWS_DEFAULT_REGION:-ap-southeast-1}}"
    export AWS_DEFAULT_REGION="${REGION}"
    ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
    printf '%s\n' \
      "bucket         = \"cms-devops-dev-tfstate-${ACCOUNT}\"" \
      'key            = "cms-devops/dev/terraform.tfstate"' \
      "region         = \"${REGION}\"" \
      'dynamodb_table = "cms-devops-dev-tflock"' \
      'encrypt        = true' \
      > terraform/backend.hcl
    cd terraform
    terraform init -input=false -no-color -backend-config=backend.hcl >/dev/null
    BUCKET=$(terraform output -raw models_bucket)
    ROLE_ARN=$(terraform output -raw demo_app_role_arn)
    cd ..
    helm upgrade --install demo-app ./app/chart --namespace default \
      --set image.repository=${ECR_REGISTRY}/${ECR_REPO} \
      --set image.tag=${BUILD_NUMBER} \
      --set models.s3Bucket=${BUCKET} \
      --set serviceAccount.roleArn=${ROLE_ARN} \
      --wait --timeout 15m
  - "kubectl rollout status deployment/demo-app -n default --timeout=15m"
