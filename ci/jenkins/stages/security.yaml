name: Security
agent: laptop
steps:
  - "bash -lc 'set -euo pipefail; if ! command -v trivy >/dev/null 2>&1; then echo Installing Trivy...; curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /tmp/trivy-bin v0.58.0; export PATH=/tmp/trivy-bin:$PATH; fi; trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 0 ./backend ./frontend'"
