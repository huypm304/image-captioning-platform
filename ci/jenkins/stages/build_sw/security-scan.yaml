name: Security Scan
agent: laptop
# Run Trivy in Docker (reliable arch + deps). Same pattern as frontend-build; avoids curl|sh install failures on Jenkins agents.
steps:
  - >-
    bash -lc 'set -euo pipefail;
    cd "${WORKSPACE}";
    docker run --rm
    -v "${WORKSPACE}:/work:ro"
    -w /work
    aquasec/trivy:0.58.0
    fs --no-progress --scanners vuln --severity HIGH,CRITICAL --exit-code 0
    ./applications'
