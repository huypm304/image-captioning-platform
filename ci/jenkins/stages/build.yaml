name: Build
agent: laptop
steps:
  - "aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}"
  - "docker build -t ${ECR_REPO_BE}:${BUILD_NUMBER} ./backend"
  - "docker tag ${ECR_REPO_BE}:${BUILD_NUMBER} ${ECR_REGISTRY}/${ECR_REPO_BE}:${BUILD_NUMBER}"
  - "docker push ${ECR_REGISTRY}/${ECR_REPO_BE}:${BUILD_NUMBER}"
  - "docker build -t ${ECR_REPO_FE}:${BUILD_NUMBER} ./frontend"
  - "docker tag ${ECR_REPO_FE}:${BUILD_NUMBER} ${ECR_REGISTRY}/${ECR_REPO_FE}:${BUILD_NUMBER}"
  - "docker push ${ECR_REGISTRY}/${ECR_REPO_FE}:${BUILD_NUMBER}"
