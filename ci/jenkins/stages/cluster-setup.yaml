# App (CI) pipeline: configure laptop agent against EKS and install cluster add-ons.
# Requires: EKS already exists (Infra apply), aws-creds-id, agent tools (kubectl, helm, eksctl, docker optional here).
# Does not run 08-upload-models (weights stay local / S3 sync separately).
name: Cluster setup
agent: laptop
steps:
  - >-
    bash -lc 'set -euo pipefail;
    cd "${WORKSPACE}";
    bash scripts/02-configure-kubectl.sh;
    bash scripts/03-install-alb.sh;
    bash scripts/04-deploy-services.sh;
    bash scripts/05-verify.sh;
    bash scripts/09-install-argocd.sh;
    kubectl apply -f deploy/gitops/applications/'
