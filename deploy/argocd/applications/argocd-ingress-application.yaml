# Argo CD Application — ALB ingress for Argo CD UI (Kustomize under deploy/argocd/manifests/argocd-ingress).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-ingress
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/huypm304/image-captioning-platform.git
    targetRevision: "feature/test"
    path: deploy/argocd/manifests/argocd-ingress
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
  # Bootstrap patches ACM from Terraform; Git may keep a placeholder. Do not revert that annotation.
  ignoreDifferences:
    - group: networking.k8s.io
      kind: Ingress
      jqPathExpressions:
        - .metadata.annotations["alb.ingress.kubernetes.io/certificate-arn"]
