apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  labels:
    app.kubernetes.io/name: demo-app
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-app
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      initContainers:
        - name: fetch-models
          image: amazon/aws-cli:2.17.0
          env:
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.env.AWS_REGION | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              aws s3 cp --recursive \
                "s3://{{ .Values.models.s3Bucket }}/{{ .Values.models.s3Prefix }}" \
                "{{ .Values.models.mountPath }}/"
          volumeMounts:
            - name: models
              mountPath: {{ .Values.models.mountPath }}
      containers:
        - name: demo-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: AWS_REGION
              value: {{ .Values.env.AWS_REGION | quote }}
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.env.AWS_REGION | quote }}
            - name: VIT_CAPTION_MODEL_PATH
              value: "{{ .Values.models.mountPath }}/vit_attention_full_patched.keras"
            - name: VIT_PROJ_W_PATH
              value: "{{ .Values.models.mountPath }}/vit_proj_W.npy"
            - name: VIT_METADATA_PATH
              value: "{{ .Values.models.mountPath }}/v2_metadata.pkl"
            - name: HF_HOME
              value: /hf-cache
            - name: TRANSFORMERS_CACHE
              value: /hf-cache
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 8
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 180
            periodSeconds: 30
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: {{ .Values.models.mountPath }}
              readOnly: true
            - name: hf-cache
              mountPath: /hf-cache
      volumes:
        - name: models
          emptyDir: {}
        - name: hf-cache
          emptyDir: {}
